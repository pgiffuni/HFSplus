# Generated by tools/genmanifests.sh -- do not hand-edit [volume]/[forks].
name = "journal-with-compressed"
description = "Journaled HFS+ volume with a file compressed via decmpfs (zlib type 2), exercising the decompression read path."
filesystem = "HFS+"
journaled = true
case_sensitive = false

[source]
type = "generated"
tool = "mkfs.hfsplus, then tools/mkfiles.py"
tool_version = "540.1.linux3"
tool_licence = "APSL-2.0"
command = "mkfs.hfsplus -J -v Journaled tests/images/generated/journaled-hfsplus.img, then tools/mkfiles.py --add-compressed-file"
image = "tests/images/generated/journal-with-compressed.img"
# Images embed creation timestamps, so this digest changes on regeneration.
# It is recorded for provenance, not used as a byte-exact test fixture.
sha256_informational = "e30a8ca46a2f5652e59f0c1455ab632b4985761b2528cbab550109a04886e80d"

[volume]
block_size = 4096
total_blocks = 256
free_blocks = 72
volume_bytes = 1048576
next_catalog_id = 22
file_count = 6
folder_count = 0
attributes = "0x80002100"
unmounted = true
journal_info_block = 2
expanded_times = false

[forks.allocationFile]
logical_size = 4096
total_blocks = 1

[forks.extentsFile]
logical_size = 32768
total_blocks = 8

[forks.catalogFile]
logical_size = 32768
total_blocks = 8

[forks.attributesFile]
logical_size = 65536
total_blocks = 16

[forks.startupFile]
logical_size = 0
total_blocks = 0


[features]
catalog_btree = true
extents_overflow_btree = true
attributes_btree = true
journal = true
# Not yet determinable from the volume header alone; see README.
unicode = true
hard_links = false
directory_hard_links = false
resource_forks = false
xattrs = true
compression = true
sparse_files = false

[expect]
# "mount" | "mount-readonly" | "reject-cleanly"
outcome = "mount-readonly"
# Structural error the parser must return instead of panicking.
expected_error = ""
note = "HFS+/HFSX read-only support is the milestone under test"

[verify]
checker = "fsck.hfsplus"
checker_version = "540.1.linux3-6build1"
verdict = "OK"
checker_output_contains = "appears to be OK"

# Hand-edited: what the volume must contain. `tools/genmanifests.sh` does not
# write this section -- it carries the previous one forward -- because the
# expectation is the specification, not something captured from the image.

[[files]]
name = "compressed.bin"
kind = "file"
size = 410
mode = "0o100644"
cnid = 21
extents = 0
note = "decmpfs-compressed file (zlib type 2): data fork empty, compressed bytes in resource fork, com.apple.decmpfs xattr with 16-byte header; reader must decompress 55 bytes to 410-byte payload"
