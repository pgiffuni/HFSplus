# Generated by tools/genmanifests.sh -- do not hand-edit [volume]/[forks].
name = "journal-with-files"
description = "Journaled volume with files added by tools/mkfiles.py: fragmented extents and a symlink."
filesystem = "HFS+"
journaled = true
case_sensitive = false

[source]
type = "generated"
tool = "mkfs.hfsplus, then tools/mkfiles.py"
tool_version = "540.1.linux3"
tool_licence = "APSL-2.0"
command = "mkfs.hfsplus -J -v Journaled tests/images/generated/journaled-hfsplus.img, then tools/mkfiles.py"
image = "tests/images/generated/journal-with-files.img"
# Images embed creation timestamps, so this digest changes on regeneration.
# It is recorded for provenance, not used as a byte-exact test fixture.
sha256_informational = "d440336c6e9e6ab0888244d747e49620b0b63125c1b6bdf38bf2185e751b247e"

[volume]
block_size = 4096
total_blocks = 8192
free_blocks = 7859
volume_bytes = 33554432
next_catalog_id = 20
file_count = 4
folder_count = 0
attributes = "0x80002100"
unmounted = true
journal_info_block = 2
expanded_times = false

[forks.allocationFile]
logical_size = 4096
total_blocks = 1

[forks.extentsFile]
logical_size = 262144
total_blocks = 64

[forks.catalogFile]
logical_size = 262144
total_blocks = 64

[forks.attributesFile]
logical_size = 262144
total_blocks = 64

[forks.startupFile]
logical_size = 0
total_blocks = 0


[features]
catalog_btree = true
extents_overflow_btree = true
attributes_btree = true
journal = true
# Not yet determinable from the volume header alone; see README.
unicode = true
hard_links = false
directory_hard_links = false
resource_forks = false
xattrs = false
finder_info = false
compression = false
sparse_files = false

[expect]
# "mount" | "mount-readonly" | "reject-cleanly"
outcome = "mount-readonly"
# Structural error the parser must return instead of panicking.
expected_error = ""
note = "HFS+/HFSX read-only support is the milestone under test"

[verify]
checker = "fsck.hfsplus"
checker_version = "540.1.linux3-6build1"
verdict = "OK"
checker_output_contains = "appears to be OK"

# Hand-edited: what the volume must contain. `tools/genmanifests.sh` does not
# write this section, because the expectation is the specification, not something
# captured from the image.
#
# `sha256_of_data` is over the file's whole data fork as read through the public
# API, so it pins the content, not merely the geometry.

[[files]]
name = "fragmented.bin"
kind = "file"
size = 32768
mode = "0o100644"
cnid = 18
extents = 8
sparse = false
note = "eight single-block extents at physically scattered blocks; each block begins with its own block number in big-endian"

[[files]]
name = "link"
kind = "symlink"
size = 19
mode = "0o120755"
cnid = 19
extents = 1
target = "../elsewhere/target"
note = "the target is stored in the data fork as UTF-8 with no terminator, which is where Apple keeps it"
